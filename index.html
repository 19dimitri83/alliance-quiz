<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ereignis-Registrierung</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #ff9800;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
            --input-bg: #3d3d3d;
            --border-color: #4d4d4d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .form-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            border-top: 5px solid var(--accent-color);
        }
        h2 { text-align: center; margin-top: 0; color: var(--accent-color); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 16px;
        }
        select:focus, input:focus { outline: none; border-color: var(--accent-color); }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-label { display: flex; align-items: center; font-weight: normal; cursor: pointer; }
        .radio-label input { margin-right: 6px; width: auto; }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e68a00; }
        .timezone-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: -15px;
            margin-bottom: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2 id="formTitle">Ereignis-Registrierung</h2>
    
    <!-- HIER IST DEINE NEUE EMAIL NUN FEST EINGETRAGEN: -->
    <form action="https://formsubmit.co/1791dimon@mail.ru" method="POST" id="quizForm">
        
        <!-- 1. Allianz -->
        <div class="form-group">
            <label>1. Allianzname</label>
            <select name="alliance" required>
                <option value="GOD">GOD</option>
                <option value="PMC">PMC</option>
                <option value="UNO">UNO</option>
                <option value="VVV">VVV</option>
                <option value="pop">pop</option>
                <option value="MKK">MKK</option>
            </select>
        </div>

        <!-- 2. Truppen -->
        <div class="form-group">
            <label>2. Truppentyp</label>
            <select name="troops" id="optTroops" required></select>
        </div>

        <!-- 3. Tier -->
        <div class="form-group">
            <label>3. Rang (Tier)</label>
            <select name="tier" required>
                <option value="T8">T8</option>
                <option value="T9">T9</option>
                <option value="T10">T10</option>
                <option value="T11">T11</option>
                <option value="T12">T12</option>
            </select>
        </div>

        <!-- 4. Nickname -->
        <div class="form-group">
            <label>4. In-Game-Name</label>
            <input type="text" name="nickname" required autocomplete="off">
        </div>

        <!-- 5. Truppgröße -->
        <div class="form-group">
            <label>5. Truppgröße</label>
            <input type="number" name="squadSize" required min="1">
        </div>

        <!-- 6. Marschgröße -->
        <div class="form-group">
            <label>6. Marschgruppengröße</label>
            <input type="number" name="marchSize" required min="1">
        </div>

        <!-- 7. Schichten -->
        <div class="form-group">
            <label>7. Verfügbarkeit (Ihre Ortszeit)</label>
            <select name="availability" id="optAvailability" required></select>
        </div>
        <div class="timezone-info" id="tzInfo"></div>

        <!-- 8. Kapitän -->
        <div class="form-group">
            <label>8. Bereitschaft, Kapitän zu sein und Diamanten auszugeben</label>
            <div class="radio-group" id="optCaptain"></div>
        </div>

        <input type="hidden" name="_next" value="https://formsubmit.co">
        <button type="submit" id="btnSubmit">Absenden</button>
    </form>
</div>

<script>
    const translations = {
        ru: { title: "Регистрация в событие", alliance: "1. Название альянса", troops: "2. Тип войск", troopsOpts: ["Бойцы", "Наездники", "Стрелки"], tier: "3. Тир", nickname: "4. Игровой ник", squadSize: "5. Размер отряда", marchSize: "6. Размер группы марша", availability: "7. Доступность (Ваше местное время)", shift1: "Первая смена", shift2: "Вторая смена", shiftBoth: "Обе смены", tzDetect: "Часовой пояс: ", captain: "8. Готовность быть капитаном и тратить алмазы", yes: "Да", no: "Нет", submit: "Отправить" },
        de: { title: "Ereignis-Registrierung", alliance: "1. Allianzname", troops: "2. Truppentyp", troopsOpts: ["Infanterie", "Reiter", "Schützen"], tier: "3. Rang (Tier)", nickname: "4. In-Game-Name", squadSize: "5. Truppgröße", marchSize: "6. Marschgruppengröße", availability: "7. Verfügbarkeit (Ihre Ortszeit)", shift1: "Erste Schicht", shift2: "Zweite Schicht", shiftBoth: "Beide Schichten", tzDetect: "Zeitzone: ", captain: "8. Bereitschaft, Kapitän zu sein und Diamanten auszugeben", yes: "Ja", no: "Nein", submit: "Absenden" }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let forcedLang = urlParams.get('lang');
    
    let userLang = forcedLang || navigator.language || navigator.userLanguage || 'de';
    let baseLangKey = userLang.toLowerCase().split('-')[0]; // FIX: Holt jetzt garantiert nur "de" oder "ru"
    
    const lang = translations[baseLangKey] ? translations[baseLangKey] : translations['de'];

    function getLocalTimeStr(mskHour) {
        const now = new Date();
        const mskOffset = 3 * 60; 
        const userOffset = -now.getTimezoneOffset(); 
        const diffHours = (userOffset - mskOffset) / 60;
        let localHour = mskHour + diffHours;
        if (localHour >= 24) localHour -= 24;
        if (localHour < 0) localHour += 24;
        return Math.floor(localHour).toString().padStart(2, '0') + ':' + (localHour % 1 * 60).toString().padStart(2, '0');
    }

    const localTimeShift1 = getLocalTimeStr(13);
    const localTimeShift2 = getLocalTimeStr(17);

    document.getElementById('formTitle').innerText = lang.title;
    document.getElementById('btnSubmit').innerText = lang.submit;

    const troopsSelect = document.getElementById('optTroops');
    lang.troopsOpts.forEach(val => {
        let opt = document.createElement('option'); opt.value = val; opt.innerText = val; troopsSelect.appendChild(opt);
    });

    const availSelect = document.getElementById('optAvailability');
    const shifts = [
        { value: "Shift 1", text: lang.shift1 + ' - ' + localTimeShift1 },
        { value: "Shift 2", text: lang.shift2 + ' - ' + localTimeShift2 },
        { value: "Both Shifts", text: lang.shiftBoth + ' (' + localTimeShift1 + ' / ' + localTimeShift2 + ')' }
    ];
    shifts.forEach(shift => {
        let opt = document.createElement('option'); opt.value = shift.value; opt.innerText = shift.text; availSelect.appendChild(opt);
    });

    try {
        const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone;
        document.getElementById('tzInfo').innerText = lang.tzDetect + tzName;
    } catch(e) { document.getElementById('tzInfo').style.display = 'none'; }

    document.getElementById('optCaptain').innerHTML = `
        <label class="radio-label"><input type="radio" name="captain" value="Yes" required> ${lang.yes}</label>
        <label class="radio-label"><input type="radio" name="captain" value="No"> ${lang.no}</label>
    `;
</script>
</body>
</html>
