<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация в событие</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #ff9800;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
            --input-bg: #3d3d3d;
            --border-color: #4d4d4d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .form-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            border-top: 5px solid var(--accent-color);
        }
        h2 { text-align: center; margin-top: 0; color: var(--accent-color); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 16px;
        }
        select:focus, input:focus { outline: none; border-color: var(--accent-color); }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-label { display: flex; align-items: center; font-weight: normal; cursor: pointer; }
        .radio-label input { margin-right: 6px; width: auto; }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e68a00; }
        .timezone-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: -15px;
            margin-bottom: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Регистрация в событие</h2>
    
    <form action="https://formsubmit.co" method="POST">
        
        <!-- 1. Название альянса -->
        <div class="form-group">
            <label>1. Название альянса</label>
            <select name="alliance" required>
                <option value="GOD">GOD</option>
                <option value="PMC">PMC</option>
                <option value="UNO">UNO</option>
                <option value="VVV">VVV</option>
                <option value="pop">pop</option>
                <option value="MKK">MKK</option>
            </select>
        </div>

        <!-- 2. Тип войск -->
        <div class="form-group">
            <label>2. Тип войск</label>
            <select name="troops" required>
                <option value="Бойцы">Бойцы</option>
                <option value="Наездники">Наездники</option>
                <option value="Стрелки">Стрелки</option>
            </select>
        </div>

        <!-- 3. Тир -->
        <div class="form-group">
            <label>3. Тир</label>
            <select name="tier" required>
                <option value="T8">Т8</option>
                <option value="T9">Т9</option>
                <option value="T10">Т10</option>
                <option value="T11">Т11</option>
                <option value="T12">Т12</option>
            </select>
        </div>

        <!-- 4. Игровой ник -->
        <div class="form-group">
            <label>4. Игровой ник</label>
            <input type="text" name="nickname" required autocomplete="off">
        </div>

        <!-- 5. Размер отряда -->
        <div class="form-group">
            <label>5. Размер отряда</label>
            <input type="number" name="squadSize" required min="1">
        </div>

        <!-- 6. Размер группы марша -->
        <div class="form-group">
            <label>6. Размер группы марша</label>
            <input type="number" name="marchSize" required min="1">
        </div>

        <!-- 7. Доступность -->
        <div class="form-group">
            <label>7. Доступность (Ваше местное время)</label>
            <select name="availability" id="optAvailability" required></select>
        </div>
        <div class="timezone-info" id="tzInfo"></div>

        <!-- 8. Капитан -->
        <div class="form-group">
            <label>8. Готовность быть капитаном и тратить алмазы</label>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="captain" value="Yes" required> Да</label>
                <label class="radio-label"><input type="radio" name="captain" value="No"> Нет</label>
            </div>
        </div>

        <input type="hidden" name="_next" value="https://formsubmit.co">
        <button type="submit">Отправить</button>
    </form>
</div>

<script>
    // Hier wird NUR noch die Uhrzeit vollautomatisch berechnet!
    function getLocalTimeStr(mskHour) {
        const now = new Date();
        const mskOffset = 3 * 60; 
        const userOffset = -now.getTimezoneOffset(); 
        const diffHours = (userOffset - mskOffset) / 60;
        let localHour = mskHour + diffHours;
        if (localHour >= 24) localHour -= 24;
        if (localHour < 0) localHour += 24;
        return Math.floor(localHour).toString().padStart(2, '0') + ':' + (localHour % 1 * 60).toString().padStart(2, '0');
    }

    const localTimeShift1 = getLocalTimeStr(13); // 13:00 MSK
    const localTimeShift2 = getLocalTimeStr(17); // 17:00 MSK

    const availSelect = document.getElementById('optAvailability');
    const shifts = [
        { value: "Shift 1", text: 'Первая смена - ' + localTimeShift1 },
        { value: "Shift 2", text: 'Вторая смена - ' + localTimeShift2 },
        { value: "Both Shifts", text: 'Обе смены (' + localTimeShift1 + ' / ' + localTimeShift2 + ')' }
    ];
    
    shifts.forEach(shift => {
        let opt = document.createElement('option'); 
        opt.value = shift.value; 
        opt.innerText = shift.text; 
        availSelect.appendChild(opt);
    });

    try {
        const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone;
        document.getElementById('tzInfo').innerText = "Часовой пояс устройства: " + tzName;
    } catch(e) { 
        document.getElementById('tzInfo').style.display = 'none'; 
    }
</script>
</body>
</html>
