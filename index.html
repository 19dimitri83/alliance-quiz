<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance Event Registration</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #ff9800;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
            --input-bg: #3d3d3d;
            --border-color: #4d4d4d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .form-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            border-top: 5px solid var(--accent-color);
        }
        .rtl { direction: rtl; text-align: right; }
        .rtl .radio-label input { margin-left: 8px; margin-right: 0; }
        h2 { text-align: center; margin-top: 0; color: var(--accent-color); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 16px;
        }
        select:focus, input:focus { outline: none; border-color: var(--accent-color); }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-label { display: flex; align-items: center; font-weight: normal; cursor: pointer; }
        .radio-label input { margin-right: 6px; width: auto; }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e68a00; }
        .timezone-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: -15px;
            margin-bottom: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="form-container" id="mainContainer">
    <h2 id="formTitle">Registration</h2>
    
    <form action="https://formsubmit.co" method="POST" id="quizForm">
        
        <!-- 1. Alliance -->
        <div class="form-group">
            <label id="lblAlliance">1. Alliance Name</label>
            <select name="alliance" required>
                <option value="GOD">GOD</option>
                <option value="PMC">PMC</option>
                <option value="UNO">UNO</option>
                <option value="VVV">VVV</option>
                <option value="pop">pop</option>
                <option value="MKK">MKK</option>
            </select>
        </div>

        <!-- 2. Troops -->
        <div class="form-group">
            <label id="lblTroops">2. Troop Type</label>
            <select name="troops" id="optTroops" required></select>
        </div>

        <!-- 3. Tier -->
        <div class="form-group">
            <label id="lblTier">3. Tier</label>
            <select name="tier" required>
                <option value="T8">T8</option>
                <option value="T9">T9</option>
                <option value="T10">T10</option>
                <option value="T11">T11</option>
                <option value="T12">T12</option>
            </select>
        </div>

        <!-- 4. Nickname -->
        <div class="form-group">
            <label id="lblNickname">4. In-Game Nickname</label>
            <input type="text" name="nickname" required autocomplete="off">
        </div>

        <!-- 5. Squad Size -->
        <div class="form-group">
            <label id="lblSquadSize">5. Squad Size</label>
            <input type="number" name="squadSize" required min="1">
        </div>

        <!-- 6. March Size -->
        <div class="form-group">
            <label id="lblMarchSize">6. March Group Size</label>
            <input type="number" name="marchSize" required min="1">
        </div>

        <!-- 7. Shifts -->
        <div class="form-group">
            <label id="lblAvailability">7. Availability (Your Local Time)</label>
            <select name="availability" id="optAvailability" required></select>
        </div>
        <div class="timezone-info" id="tzInfo"></div>

        <!-- 8. Captain -->
        <div class="form-group">
            <label id="lblCaptain">8. Willingness to be a captain and spend diamonds</label>
            <div class="radio-group" id="optCaptain"></div>
        </div>

        <input type="hidden" name="_next" value="https://formsubmit.co">
        <button type="submit" id="btnSubmit">Submit</button>
    </form>
</div>
